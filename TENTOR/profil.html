<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Tentor — MAN 1 Jepara</title>
    <link rel="stylesheet" href="../shared-theme.css">
</head>

<body>
    <div class="app-layout">
        <!-- SIDEBAR -->
        <aside class="app-sidebar" id="sidebar">
            <div class="sidebar-brand">
                <img src="../logomansara.png" alt="Logo MAN 1 Jepara" class="brand-logo">
                <div class="brand-text">
                    <h2>MAN 1 Jepara</h2>
                    <p>IBS Al Fikra</p>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="dasbor.html" class="nav-item">
                    <span class="nav-icon">📷</span>
                    <span class="nav-label">Scan & Dashboard</span>
                </a>
                <a href="verifikasi.html" class="nav-item">
                    <span class="nav-icon">✍️</span>
                    <span class="nav-label">Verifikasi Manual</span>
                </a>
                <a href="rekap-hari-ini.html" class="nav-item">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Rekap Hari Ini</span>
                </a>
                <a href="riwayat-sesi.html" class="nav-item">
                    <span class="nav-icon">📜</span>
                    <span class="nav-label">Riwayat Sesi Saya</span>
                </a>
                <a href="profil.html" class="nav-item active">
                    <span class="nav-icon">👤</span>
                    <span class="nav-label">Profil</span>
                </a>

                <a href="javascript:void(0)" class="nav-item nav-logout" onclick="keluarSistem()">
                    <span class="nav-icon">🚪</span>
                    <span class="nav-label">Keluar</span>
                </a>
            </nav>

            <div class="sidebar-watermark">
                <img src="masjid-siluet.svg" alt="Watermark Masjid">
            </div>
        </aside>

        <!-- APP CONTENT WRAPPER -->
        <div class="app-content-wrapper">
            <!-- TOPBAR -->
            <header class="app-topbar">
                <button class="topbar-menu-toggle" onclick="toggleSidebar()" title="Toggle Sidebar">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
                <div class="topbar-right">
                    <div class="topbar-notif" title="Notifikasi Sistem">
                        <span class="notif-bell">🔔</span>
                        <span class="notif-dot"></span>
                    </div>
                    <div class="topbar-user" onclick="window.location.href='profil.html'">
                        <div class="user-avatar">
                            <span class="avatar-peci">👳</span>
                        </div>
                        <div class="user-info">
                            <span class="user-name" id="infoPengguna">Tentor Pendamping</span>
                            <span class="user-role">Petugas Presensi Gerbang</span>
                        </div>
                        <span class="user-chevron">▾</span>
                    </div>
                </div>
            </header>

            <!-- MAIN BODY -->
            <main class="app-main">
                <div class="inner-card" style="max-width: 720px; margin: 0 auto; width: 100%;">
                    <h2>👤 Profil Akun Tentor / Pendamping</h2>
                    <p class="lead-desc">Informasi akun pengguna dan sesi aktif petugas presensi.</p>

                    <form id="formProfilTentor" style="background:#f8fafc; padding:24px; border-radius:16px; border:1px solid #e2e8f0; margin-bottom:24px;">
                        <div class="form-group">
                            <label>Nama Lengkap</label>
                            <input type="text" id="profNama" required style="background:#fff;">
                        </div>
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" id="profUser" readonly style="background:#f1f5f9;">
                        </div>
                        <div class="form-group">
                            <label>Peran / Role</label>
                            <input type="text" id="profPeran" readonly style="background:#f1f5f9;">
                        </div>
                        <div class="form-group">
                            <label>Password Baru (Kosongkan jika tidak ingin mengubah)</label>
                            <input type="password" id="profPassBaru" placeholder="Masukkan password baru..." style="background:#fff;">
                        </div>
                        <div class="form-group">
                            <label>Waktu Masuk Sesi</label>
                            <input type="text" id="profMasuk" readonly style="background:#f1f5f9;">
                        </div>
                        <button type="submit" class="btn btn-primary" style="margin-top:8px;">💾 Simpan Perubahan Profil</button>
                    </form>

                    <button class="btn btn-danger" onclick="keluarSistem()">🚪 Keluar dari Sistem</button>
                </div>
            </main>
        </div>
    </div>

    <script src="../data-siswa.js"></script>
    <script>
        SBL.wajibPeran('Tentor');

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            if (sb) sb.classList.toggle('sidebar-open');
        }

        const sesi = SBL.akunSesi() || {};
        document.getElementById('infoPengguna').textContent = sesi.nama || 'Tentor';
        document.getElementById('profNama').value = sesi.nama || '-';
        document.getElementById('profUser').value = sesi.username || '-';
        document.getElementById('profPeran').value = sesi.peran || 'Tentor/Guru Pendamping';
        document.getElementById('profMasuk').value = sessionStorage.getItem('sesiWaktuMasuk') || new Date().toLocaleString('id-ID');

        document.getElementById('formProfilTentor').addEventListener('submit', function(e) {
            e.preventDefault();
            const namaBaru = document.getElementById('profNama').value.trim();
            const passBaru = document.getElementById('profPassBaru').value;
            if (!namaBaru) {
                alert('Nama lengkap tidak boleh kosong!');
                return;
            }
            const semua = SBL.daftarAkun();
            const idx = semua.findIndex(a => String(a.username).toLowerCase() === String(sesi.username || '').toLowerCase());
            if (idx > -1) {
                semua[idx].nama = namaBaru;
                if (passBaru) semua[idx].password = passBaru;
                SBL.simpanAkun(semua);
            }
            sesi.nama = namaBaru;
            sessionStorage.setItem('penggunaSaatIni', JSON.stringify(sesi));
            document.getElementById('infoPengguna').textContent = namaBaru;
            document.getElementById('profPassBaru').value = '';
            alert('✅ Profil & password berhasil diperbarui!');
        });

        function keluarSistem() {
            if (confirm('Yakin ingin keluar dari sistem?')) {
                sessionStorage.clear();
                window.location.href = '../index.html';
            }
        }
    </script>
</body>
</html>
